<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="로켓걸스">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2a4a">
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff;overflow:hidden;position:fixed;inset:0;width:100%}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  iframe{border:0;display:block;width:100%;height:100%}
  .err{font-family:-apple-system,sans-serif;padding:40px 20px;text-align:center;color:#555}
</style>
</head>
<body>
<script>
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } };
if(/^https:\/\/script\.google\.com\//.test(APP_URL)){
  let s=null; try{ s=JSON.parse(LS('rg-launch')||'null'); }catch(e){}
  const src = (s&&s.name&&s.pin) ? APP_URL+'?u='+encodeURIComponent(s.name)+'&p='+encodeURIComponent(s.pin) : APP_URL;
  document.write('<iframe src="'+src+'" allow="clipboard-write"></iframe>');
  // 앱이 로그인/로그아웃하면 이 페이지(홈 화면 앱)에 저장 → 껐다 켜도 유지
  window.addEventListener('message',ev=>{ const m=ev.data; if(!m||!m.rg) return;
    if(m.type==='login'&&m.name&&m.pin) LS('rg-launch',JSON.stringify({name:m.name,pin:m.pin}));
    if(m.type==='logout') LS('rg-launch',null); });
}else{
  document.write('<div class="err">rg-launcher.html 파일 안의 APP_URL에<br>앱 주소(…/exec)를 넣어주세요</div>');
}
</script>
</body>
</html>
