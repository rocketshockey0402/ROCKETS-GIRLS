<script>
const LS=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } };
if(/^https:\/\/script\.google\.com\//.test(APP_URL)){
  let s=null; try{ s=JSON.parse(LS('rg-launch')||'null'); }catch(e){}
  document.write('<div id="probe"></div>');
  const insets=()=>{ const p=document.getElementById('probe'); if(!p) return {st:0,sb:0}; const cs=getComputedStyle(p); return {st:Math.round(parseFloat(cs.paddingTop)||0),sb:Math.round(parseFloat(cs.paddingBottom)||0)}; };
  const ins=insets();
  const src = APP_URL+'?l=2&st='+ins.st+'&sb='+ins.sb+((s&&s.name&&s.pin) ? '&u='+encodeURIComponent(s.name)+'&p='+encodeURIComponent(s.pin) : '');
  document.write('<iframe src="'+src+'" allow="clipboard-write"></iframe>');
  /* 일부 아이폰 홈 화면 앱: 화면 높이(innerHeight·100%)가 상태바 높이만큼 짧게 잡혀서 앱이 맨 아래까지 안 내려옴
     → 홈 화면 앱 + (기기 화면 높이 − innerHeight)가 상태바 높이와 같을 때만 기기 화면 높이로 맞춤. 그 외 기종은 CSS(화면 네 모서리 고정) 그대로 */
  const fitFrame=()=>{ const f=document.querySelector('iframe'); if(!f) return; const i=insets(), ih=window.innerHeight||0;
    const sa=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
    const land=window.matchMedia('(orientation: landscape)').matches, sh=land?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height);
    const short=sa&&i.st>0&&Math.abs((sh-ih)-i.st)<=3;
    f.style.height=short?sh+'px':''; f.style.bottom=short?'auto':'';
    document.documentElement.style.height=document.body.style.height=short?sh+'px':'';   // 문서도 같이 늘려야 iframe 아래쪽(상태바 높이만큼)이 잘리지 않고 그려짐
    if(/dbg=1/.test(location.search)||window.__DBG){ let d=document.getElementById('dbg'); if(!d){ d=document.createElement('div'); d.id='dbg'; d.style.cssText='position:fixed;left:8px;top:50%;z-index:9;background:#000;color:#0f0;font:12px monospace;padding:6px;border-radius:6px;white-space:pre'; document.body.appendChild(d); }
      const fr=f.getBoundingClientRect(), a=window.__DBG||{};
      d.textContent='[런처] standalone '+sa+'\ninnerH '+ih+'  screenH '+sh+'  docH '+document.documentElement.clientHeight+'\nst '+i.st+'  sb '+i.sb+'  fix '+(short?sh:'css')+'\niframe top '+Math.round(fr.top)+' h '+Math.round(fr.height)
        +(a.appH?'\n[앱 '+(a.ver||'')+'] innerH '+a.appH+'  sb '+a.sb+'  st '+a.st+'\nnav top '+a.navTop+' bottom '+a.navBottom+' h '+a.navH:'')+'\n(누르면 닫힘)';
      d.onclick=()=>{ d.remove(); window.__DBG=null; }; } };
  fitFrame(); window.addEventListener('load',fitFrame);
  /* 점검 모드(임시): 열 때마다 화면 높이 숫자를 20초 동안 표시. 앱 값은 앱이 로그인 후 자동으로 보내줌 */
  setTimeout(()=>{ window.__DBG=window.__DBG||{}; fitFrame(); },1500);
  setTimeout(()=>{ const d=document.getElementById('dbg'); if(d) d.remove(); window.__DBG=null; },20000);
  let APPWIN=null;   // 앱(안쪽 프레임) — 화면 회전 등으로 여백이 바뀌면 다시 알려줌
  const sendInsets=()=>{ if(!APPWIN) return; const i=insets(); try{ APPWIN.postMessage({rg:1,type:'insets',st:i.st,sb:i.sb},'*'); }catch(e){} };

  setTimeout(hideLd,8000);
  // 앱이 로그인/로그아웃하면 이 페이지(홈 화면 앱)에 저장 → 껐다 켜도 유지
  window.addEventListener('message',ev=>{ const m=ev.data; if(!m||!m.rg) return;
    if(m.type==='login'&&m.name&&m.pin) LS('rg-launch',JSON.stringify({name:m.name,pin:m.pin}));
    if(m.type==='forget'){ LS('rg-launch',null); LS('rg-data',null); }   // 자동 로그인 해제만 (화면은 그대로)
    if(m.type==='logout'){ LS('rg-launch',null); LS('rg-data',null);   // 나가기 → 로딩 화면 띄우고 런처 전체 새로 열기 → 로그인 화면
      const l=document.getElementById('ld'); if(l) l.classList.remove('off');
      setTimeout(()=>location.replace(location.pathname),50); return; }
    if(m.type==='data'&&m.name&&m.data){ try{ LS('rg-data',JSON.stringify({name:m.name,t:Date.now(),data:m.data})); }catch(e){} }
    if(m.type==='dbg'){ window.__DBG=m; fitFrame(); return; }
    if(m.type==='ready'){ hideLd(); APPWIN=ev.source||APPWIN; sendInsets();   // 앱 뼈대가 떴음 → 마지막 데이터가 있으면 바로 넘겨줌 (서버 응답 전 즉시 표시용)
      let d=null; try{ d=JSON.parse(LS('rg-data')||'null'); }catch(e){}
      if(d&&d.name&&d.data&&ev.source) try{ ev.source.postMessage({rg:1,type:'data',name:d.name,data:d.data},'*'); }catch(e){} } });
}else{
  document.write('<div class="err">rg-launcher.html 파일 안의 APP_URL에<br>앱 주소(…/exec)를 넣어주세요</div>');
